name: CI - Detector de Frutas

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verificar-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t frutas-eva4:ci .

      - name: Ejecutar contenedor
        run: docker run -d --name frutas-api-ci -p 8000:8000 frutas-eva4:ci

      - name: Comprobar funcionamiento
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 3
          done
          docker logs frutas-api-ci
          exit 1

      - name: Probar inferencia
        run: |
          curl -fsS \
            -F "file=@tests/test_image.png;type=image/png" \
            http://127.0.0.1:8000/predict \
            -o respuesta.json

          python3 - <<'PY'
          import json
          with open("respuesta.json", encoding="utf-8") as f:
              datos = json.load(f)
          assert datos["total_detecciones"] == len(datos["detecciones"])
          assert datos["tiempo_inferencia_ms"] >= 0
          print("Prueba de inferencia exitosa:", datos)
          PY

      - name: Medir latencia de inferencia
        run: python3 tests/test_latency.py

      - name: Guardar reporte de latencia
        uses: actions/upload-artifact@v4
        with:
          name: reporte-latencia
          path: latencia_ci.json
      - name: Autenticarse en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag frutas-eva4:ci "$IMAGE:latest"
          docker tag frutas-eva4:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Mostrar errores del contenedor
        if: failure()
        run: docker logs frutas-api-ci || true


